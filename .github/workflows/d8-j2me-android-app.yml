name: D8-J2ME Android 6 NIO feasibility

on:
  push:
    branches:
      - work/d8-j2me-bootstrap
    paths:
      - .github/workflows/d8-j2me-android-app.yml
      - tools/j2me/android-smoke/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android23:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download source-built D8 API compiler
        uses: actions/download-artifact@v4
        with:
          name: d8-j2me-bootstrap
          run-id: '38159332933'
          github-token: ${{ github.token }}
          path: build/libs
      - name: Provide compiler dependency
        run: |
          test -s build/libs/d8-j2me-api.jar
          mkdir -p tools/j2me/android-smoke/app/libs
          cp build/libs/d8-j2me-api.jar tools/j2me/android-smoke/app/libs/d8-j2me-api.jar
      - name: Build Android 6 test application with NIO desugaring
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar" || sdkmanager "platforms;android-35"
          gradle --project-dir tools/j2me/android-smoke :app:assembleDebug --no-daemon --stacktrace
      - name: Permit KVM acceleration
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Run compiler inside an Android API 23 app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 512M
          script: bash tools/j2me/android-smoke/run.sh
      - name: Preserve Android log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d8-android23-smoke-log
          path: ${{ runner.temp }}/d8-j2me-android.log
          if-no-files-found: ignore
          retention-days: 7
